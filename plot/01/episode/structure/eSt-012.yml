# エピソード構造体 第1章 第12話
- sequence: 1
  sequence gist:
    - sequence gist item: 神殿外・内　早く入りたい　並ぶ列
    - sequence gist item: 女神像がアーシェス神と違う　髪が長くない　カイ神
    - sequence gist item: エルミナから譲ってもらった宝玉とも関係があるけど後で話すわ　フェリが静かに聞いている


- sequence: 2
  sequence gist:
    - sequence gist item: フェリこっちに行きましょう　並ぶ人が少ない　キスカがへぇ、という顔　エクトは説明を求め聞いて不安がりキスカが呆れる
    - sequence gist item: 運び出される魔法使い　エクト不安がる
    - sequence gist item: 神官が問う　初めてじゃないんですか大丈夫ですかここは中級ですよ　フェリ問題ありません　エクト不安　フェリ金の無駄
    - sequence gist item: 神官負ければ精神にダメージがあるけどいいのか　エクト驚く　フェリは太鼓判　いざ


- sequence: 3
  sequence gist:
    - sequence gist item: 巨大な火をまとう狼　このくらいなら大丈夫
    - sequence gist item: 空間がゆがんで赤髪の若い女が出てくる　おまえじゃ力不足だ　私がやろう　不満そうな狼だが
    - sequence gist item: お姉さんは狼より強そうだね　神殿の立像は見なかったのかもっと有名かと思っていたのにショックだ　ごめんなさい
    - sequence gist item: いいわ　あなたでも本気を出さないと死ぬわよ
    - sequence gist item: 大火　熱を感じる！　くっ
    - sequence gist item: これならどう！？　大火　第三障壁を越えてこんなに熱が伝わるなんてドラゴンよりすごい　当たり前よ
    - sequence gist item: これで最後だわ！　周囲が溶けて蒸発を始める　暑い！　汗だく　防御は強いみたいねだけど私が倒せるの？
    - sequence gist item: 僕も火を使うよこれより熱ければいいのかな　大火　蒸発　エクトが焦る　神復活
    - sequence gist item: 溶けて蒸発する世界でカイ神がフェリア見てるんでしょ冷やしてちょうだい　あなたが負けるなんてね　正直怖いわ
    - sequence gist item: 時間がかかるが冷え始める　エクトが気を利かせて一瞬で冷やす　フェリア驚愕　負けだよ


- sequence: 4
  sequence gist:
    - sequence gist item: 部屋から出てくるエクト
    - sequence gist item: 思ったより時間がかかったけどどうだった　カイっていうお姉さんと戦ったんだ　フェリアってお姉さんが冷やしてた
    - sequence gist item: フェリ驚愕　キスカ呆れる　神官訝しむ　水晶　ひれ伏す　老神官すぐに立てと言う
    - sequence gist item: 奥へ　老神官もひれ伏す　口外しないほうがいいでしょう　塔の連中　搦め手
    - sequence gist item: 奥から出てくる　見ている男　小さな水晶を通してエクトを見る　驚愕して去っていく


